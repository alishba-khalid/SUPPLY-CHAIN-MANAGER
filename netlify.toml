# Netlify build for the web app. Netlify detects Next.js and adds its
# OpenNext adapter (@netlify/plugin-nextjs) on its own.
#
# Runtime env vars (Clerk, database, Polar, CRON_SECRET, forecasting service)
# live in the Netlify UI / `netlify env`, not here — this file is public.
# FUNCTION_TIME_LIMIT_SECONDS=60 must be set there: Netlify stops every
# request at 60s, and src/lib/function-time-limit.ts budgets long work by it.
#
# The nightly jobs run from .github/workflows/ (cron.yml, forecasts.yml):
# Netlify's scheduled functions stop at 30s, and vercel.json's `crons` only
# works on Vercel.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
