# Nightly jobs, moved here from vercel.json's `crons` (Render's free plan has
# no cron jobs). Same schedules, in UTC. Each call wakes the free web service
# if it is asleep, so the first request gets a long timeout.
#
# Needs two repository secrets: APP_URL (e.g. https://supplychainmanager.app)
# and CRON_SECRET (same value as the web service's CRON_SECRET on Render).
name: Nightly jobs

on:
  schedule:
    - cron: "15 3 * * *" # cleanup-import-staging
    - cron: "0 5 * * *" # refresh-data-sources
    - cron: "0 6 * * *" # recompute-forecasts
    - cron: "30 6 * * *" # forecast-service-ping
  workflow_dispatch:
    inputs:
      job:
        description: Route under /api/cron/ to call
        required: true
        default: forecast-service-ping

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Pick route
        id: route
        run: |
          case "${{ github.event.schedule }}" in
            "15 3 * * *") echo "path=cleanup-import-staging" >> "$GITHUB_OUTPUT" ;;
            "0 5 * * *") echo "path=refresh-data-sources" >> "$GITHUB_OUTPUT" ;;
            "0 6 * * *") echo "path=recompute-forecasts" >> "$GITHUB_OUTPUT" ;;
            "30 6 * * *") echo "path=forecast-service-ping" >> "$GITHUB_OUTPUT" ;;
            *) echo "path=${{ inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Call route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 30 \
            --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/${{ steps.route.outputs.path }}"
