# Nightly forecast recompute (was /api/cron/recompute-forecasts on Vercel).
# The Python forecasting service has no free always-on host, so this job
# starts it inside the runner and runs scripts/recompute-forecasts.ts
# against it, writing results straight to the database.
#
# Also started on demand by the app's "Recompute forecasts" button
# (src/lib/forecasting/github-dispatch.ts) with one org_id.
#
# Needs one repository secret: DATABASE_URL (the Production database).
name: Nightly forecasts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      org_id:
        description: "Recompute only this org (leave empty for every org)"
        type: string
        required: false

# One run per org at a time; a second click queues behind the first
# (a per-org group, so one org's queued run never replaces another's).
concurrency:
  group: forecasts-${{ inputs.org_id || 'all' }}
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecasting-service/requirements.txt

      - name: Start forecasting service
        working-directory: forecasting-service
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../forecast-service.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 2
          done
          cat ../forecast-service.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Recompute forecasts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORECAST_SERVICE_URL: http://127.0.0.1:8000
          # Passed as an env var, never interpolated into the script.
          ORG_ID: ${{ inputs.org_id }}
        run: npx tsx scripts/recompute-forecasts.ts

      - name: Forecasting service log
        if: failure()
        run: cat forecast-service.log
